<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Live Character Counter</title>
  <style>
    body{font-family:Arial;padding:20px}
    textarea{width:100%;height:120px;font-size:14px;padding:8px}
    #count{margin-top:8px;font-weight:600}
    .yellow{color:orange}
    .red{color:red}
    button{margin-top:10px;padding:6px 12px}
  </style>
</head>
<body>
  <h2>Live Character Counter (max 100)</h2>
  <textarea id="txt" maxlength="100"></textarea>
  <div id="count">100 characters left</div>
  <button id="resetBtn">Reset</button>
  <script src="live-counter.js"></script>
</body>
</html>
