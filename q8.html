<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q8 - Box Model Exploration</title>
  <link rel="stylesheet" href="q8.css">
</head>
<body>
  <main class="container">
    <section class="box-demo">
      <div class="content-box">Content</div>
    </section>

    <section class="description">
      <h2>Box Model Layers</h2>
      <p><strong>Content:</strong> the actual text or image inside the box.</p>
      <p><strong>Padding:</strong> space between content and border.</p>
      <p><strong>Border:</strong> the visible edge surrounding padding.</p>
      <p><strong>Margin:</strong> outer space separating elements.</p>
      <p>This demo also shows the difference between <code>content-box</code> and <code>border-box</code>.</p>
    </section>
  </main>
</body>
</html>
