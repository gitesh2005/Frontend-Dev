<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>
</head>
<body>
    <form method="post" action="#">
        <label>Full Name:</label>
        <input type="text" name="fullname" placeholder="Enter your name" required><br><br>

        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email" required><br><br>

        <label>Subject:</label>
        <input type="text" name="subject" placeholder="Enter subject" required><br><br>

        <label>Message:</label><br>
        <textarea name="message" placeholder="Write your message" required></textarea><br><br>

        <input type="submit" value="Send">
    </form>
</body>
</html>
