<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Span Example</title>
  <style>
    .topic { color: blue; font-weight: bold; }
    .keyword { background-color: yellow; }
    .note { color: green; font-style: italic; }
  </style>
</head>
<body>
  <p>
    In this course, we’ll cover <span class="topic">Web Development</span> basics, 
    learn about <span class="keyword">HTML, CSS, and JavaScript</span>, 
    and remember that <span class="note">practice makes perfect!</span>
  </p>
</body>
</html>
