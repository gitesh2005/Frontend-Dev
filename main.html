<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Website with Frameset</title>
</head>
<!-- Use frameset instead of body -->
<frameset rows="100,*" border="0">
    <!-- Top frame: Navigation links -->
    <frame src="nav.html" name="navFrame">

    <!-- Bottom frame: Content -->
    <frame src="welcome.html" name="contentFrame">
</frameset>
</html>
