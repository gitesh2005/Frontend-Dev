<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Custom Dropdown</title>
  <style>
    body{font-family:Arial;padding:20px}
    .dropdown{position:relative;display:inline-block}
    .trigger{padding:8px 12px;border:1px solid #ccc;cursor:pointer}
    .options{position:absolute;top:100%;left:0;border:1px solid #ccc;background:#fff;display:none;min-width:160px;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
    .option{padding:8px 10px;cursor:pointer}
    .option:hover{background:#f0f0f0}
  </style>
</head>
<body>
  <h2>Custom Dropdown</h2>
  <div class="dropdown" id="myDropdown">
    <div class="trigger" id="ddBtn">Choose an option</div>
    <div class="options" id="ddList">
      <div class="option">Option 1</div>
      <div class="option">Option 2</div>
      <div class="option">Option 3</div>
    </div>
  </div>
  <script src="custom-dropdown.js"></script>
</body>
</html>
