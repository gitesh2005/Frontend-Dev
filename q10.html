<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Combined Layout - Q10</title>
  <link rel="stylesheet" href="q10.css"/>
</head>
<body>
  <header class="top">
    <div class="brand">Logo</div>
    <nav class="nav"> <a href="#">Home</a> <a href="#">Blog</a> <a href="#">Contact</a> </nav>
  </header>

  <main class="layout">
    <article class="article">
      <h1 class="title">Article Title</h1>
      <div class="row">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
      </div>
      <p>Some article content here. This area flows under the three boxes on small screens.</p>
    </article>

    <aside class="sidebar">
      <h3>Sidebar</h3>
      <p>Links and widgets</p>
    </aside>
  </main>

  <footer class="foot">© 2025 Your Site</footer>
</body>
</html>
