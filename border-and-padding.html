<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q1 - Borders & Padding</title>
<link rel="stylesheet" href="border-and-padding.css">
</head>
<body>
<header>
<h1>Borders & Padding Demo</h1>
</header>
<main>
<section class="box-row">
<div class="box solid">Solid<br><span>.solid</span></div>
<div class="box dashed">Dashed<br><span>.dashed</span></div>
<div class="box double">Double<br><span>.double</span></div>
<div class="box groove">Groove<br><span>.groove</span></div>
<div class="box rounded">Rounded (30px)<br><span>.rounded</span></div>
</section>
</main>
<footer>Hover a box to change its border color.</footer>
</body>
</html>
