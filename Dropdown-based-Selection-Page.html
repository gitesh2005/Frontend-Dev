<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Selection Page</title>
</head>
<body>

  <header>
    <h1>Travel Selection Page</h1>
    <p>Select your preferred travel options from the dropdowns below.</p>
  </header>

  <main>
    <form>

      <!-- Country Dropdown -->
      <label for="country">Select Country:</label>
      <select id="country" name="country" title="Choose your country">
        <option>India</option>
        <option selected>France</option>
        <option>Japan</option>
        <option>USA</option>
        <option>Australia</option>
      </select>

      <br><br>

      <!-- State Dropdown -->
      <label for="state">Select State:</label>
      <select id="state" name="state" title="Choose your state">
        <option>Uttar Pradesh</option>
        <option selected>Delhi</option>
        <option>Maharashtra</option>
        <option>Tamil Nadu</option>
        <option>Kerala</option>
      </select>

      <br><br>

      <!-- City Dropdown -->
      <label for="city">Select City:</label>
      <select id="city" name="city" title="Choose your city">
        <option selected>Agra</option>
        <option>Mumbai</option>
        <option>Chennai</option>
        <option>Kochi</option>
        <option>Tokyo</option>
      </select>

      <br><br>

      <!-- Favorite Tourist Place Dropdown -->
      <label for="place">Favorite Tourist Place:</label>
      <select id="place" name="place" title="Choose your favorite place">
        <option>Taj Mahal</option>
        <option>Eiffel Tower</option>
        <option>Mount Fuji</option>
        <option selected>Great Barrier Reef</option>
        <option>Statue of Liberty</option>
      </select>

    </form>

    <br>

    
  </main>

  <footer>
    <p>© 2025 World Travel Explorer</p>
  </footer>

</body>
</html>
