<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Plan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="pricing.css">
</head>
<body>
    <div class="container my-5">
        <h2 class="text-center mb-5">Choose Your Plan</h2>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card text-center p-3 shadow-sm plan-card">
                    <h4 class="mt-3">Basic</h4>
                    <h2 class="my-3">$9<span class="fs-6 text-muted">/mo</span></h2>
                    <ul class="list-unstyled mb-4">
                        <li>1 Project</li>
                        <li>5 GB Storage</li>
                        <li>Email Support</li>
                    </ul>
                    <button class="btn btn-outline-primary">Select Plan</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-center p-3 bg-primary text-white shadow-sm plan-card">
                    <h4 class="mt-3">Pro</h4>
                    <h2 class="my-3">$19<span class="fs-6 text-light">/mo</span></h2>
                    <ul class="list-unstyled mb-4">
                        <li>10 Projects</li>
                        <li>50 GB Storage</li>
                        <li>Priority Support</li>
                    </ul>
                    <button class="btn btn-light text-primary fw-bold">Select Plan</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-center p-3 shadow-sm plan-card">
                    <h4 class="mt-3">Enterprise</h4>
                    <h2 class="my-3">$49<span class="fs-6 text-muted">/mo</span></h2>
                    <ul class="list-unstyled mb-4">
                        <li>Unlimited Projects</li>
                        <li>200 GB Storage</li>
                        <li>Dedicated Support</li>
                    </ul>
                    <button class="btn btn-outline-primary">Select Plan</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
