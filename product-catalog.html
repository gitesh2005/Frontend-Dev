<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Your CSS file -->
  <link rel="stylesheet" href="product-catalog.css">
</head>

<body class="bg-light">

  <div class="container py-5">
    <h2 class="text-center mb-4">🛍️ Product Catalog</h2>
    <div class="row g-4">
      
      <!-- Product 1 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card p-3">
          <img src="watch.jpeg" class="product-img card-img-top" alt="Product 1">
          <div class="card-body text-center">
            <h5 class="card-title">Classic Watch</h5>
            <p class="card-text text-success fw-bold">$120M</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 2 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card p-3">
          <img src="https://via.placeholder.com/250" class="product-img card-img-top" alt="Product 2">
          <div class="card-body text-center">
            <h5 class="card-title">Leather Shoes</h5>
            <p class="card-text text-success fw-bold">$85</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 3 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card p-3">
          <img src="https://via.placeholder.com/250" class="product-img card-img-top" alt="Product 3">
          <div class="card-body text-center">
            <h5 class="card-title">Smartphone</h5>
            <p class="card-text text-success fw-bold">$699</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 4 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card p-3">
          <img src="https://via.placeholder.com/250" class="product-img card-img-top" alt="Product 4">
          <div class="card-body text-center">
            <h5 class="card-title">Wireless Headphones</h5>
            <p class="card-text text-success fw-bold">$99</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
