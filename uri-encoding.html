<!DOCTYPE html>
<html>
<head>
    <title>URI Encoding Example</title>
</head>
<body>
    <p>Unencoded URL:</p>
    <a href="https://example.com/search?query=HTML & CSS">Unencoded Link</a><br><br>

    <p>Encoded URL:</p>
    <a href="https://example.com/search?query=HTML%20%26%20CSS">Encoded Link</a>
</body>
</html>
